# The storage qualification workload measures its filesystem's free space to the byte and
# fails when anything else writes to that filesystem between its samples. The gate runs its
# lanes concurrently, so the default profile leaves that one test out and the gate runs it
# through the disk profile, alone, after every other lane has finished. `cargo test` still
# runs it, and so does `cargo nextest run --profile disk` on a quiet machine.
[profile.default]
default-filter = 'not test(production_workload_measures_every_required_case_and_phase)'

[profile.disk]
default-filter = 'test(production_workload_measures_every_required_case_and_phase)'
