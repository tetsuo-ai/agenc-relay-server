name: Stage 10 aarch64 release build

# Builds the native aarch64 release image and the reproduced release
# artifacts on a hosted ARM runner. The uploaded build directory is one of
# the two build records `qualify-release.py prepare` needs for a two-target
# candidate; the aarch64 qualification jobs themselves must run on an
# aarch64 host against that candidate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aarch64-release-build:
    name: aarch64-unknown-linux-gnu release build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact source revision
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned Rust build contract
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add --toolchain 1.98.0 clippy llvm-tools-preview rustfmt
          rustup target add --toolchain 1.98.0 aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
          rustup default 1.98.0

      - name: Confirm the native target and the container runtime
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-unknown-linux-gnu"
          docker version
          uname -a

      - name: Build the release image
        run: python3 scripts/build-release-image.py --output release-image

      - name: Build the release artifacts twice
        run: |
          python3 scripts/build-release.py build \
            --image "$(cat release-image/image-id.txt)" \
            --output release-build

      - name: Upload the image record and the build directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage-10-aarch64-release-build
          path: |
            release-image/image.json
            release-image/packages.txt
            release-image/build.log
            release-build/
          if-no-files-found: error
          retention-days: 90
