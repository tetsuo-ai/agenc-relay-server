name: Stage 08 implementation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: stage-eight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-eight:
    name: Stage 08 implementation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact source revision
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned Rust build contract
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup toolchain install nightly-2026-08-24 --profile minimal
          rustup component add --toolchain 1.98.0 clippy llvm-tools-preview rustfmt
          rustup component add --toolchain nightly-2026-08-24 rustfmt
          rustup target add --toolchain 1.98.0 aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

      - name: Install pinned policy and evidence tools
        run: |
          cargo +1.98.0 install --locked cargo-deny --version 0.20.2
          cargo +1.98.0 install --locked cargo-audit --version 0.22.2
          cargo +1.98.0 install --locked cargo-llvm-cov --version 0.9.0
          cargo +1.98.0 install --locked cargo-fuzz --version 0.13.2

      - name: Install Stage 06 through Stage 08 host qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross tor

      - name: Free hosted-runner disk for the coverage and fuzz builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Run Stage 08 implementation checks
        run: bash scripts/check-stage-eight.sh
