[package]
name = "agenc-relay-fuzz"
version = "1.0.0-rc.3"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = []
wss = ["agenc-relay-client-wire/wss"]

[dependencies]
agenc-relay-client-wire = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-client-wire" }
agenc-relay-admin = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-admin" }
agenc-relay-auth = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-auth" }
agenc-relay-config = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-config" }
agenc-relay-crypto = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-crypto" }
agenc-relay-e2ee = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-e2ee" }
agenc-relay-federation-wire = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-federation-wire" }
agenc-relay-storage = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-storage" }
agenc-relay-types = { version = "=1.0.0-rc.3", path = "../crates/agenc-relay-types" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "tcp_framing"
path = "fuzz_targets/tcp_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket"
path = "fuzz_targets/websocket.rs"
test = false
doc = false
bench = false

[[bin]]
