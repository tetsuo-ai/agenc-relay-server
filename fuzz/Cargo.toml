[package]
name = "agenc-ircd-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
agenc-ircd-client-wire = { version = "=0.0.0", path = "../crates/agenc-ircd-client-wire" }
agenc-ircd-auth = { version = "=0.0.0", path = "../crates/agenc-ircd-auth" }
agenc-ircd-crypto = { version = "=0.0.0", path = "../crates/agenc-ircd-crypto" }
agenc-ircd-storage = { version = "=0.0.0", path = "../crates/agenc-ircd-storage" }
agenc-ircd-types = { version = "=0.0.0", path = "../crates/agenc-ircd-types" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "tcp_framing"
path = "fuzz_targets/tcp_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket"
path = "fuzz_targets/websocket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_render"
path = "fuzz_targets/parse_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_state"
path = "fuzz_targets/client_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_service_envelope"
path = "fuzz_targets/account_service_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypto_wrappers"
path = "fuzz_targets/crypto_wrappers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "storage_codecs"
path = "fuzz_targets/storage_codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_stream"
path = "fuzz_targets/backup_stream.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
