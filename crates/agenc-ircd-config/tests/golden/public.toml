# Golden complete configuration for the `public` profile with every table and
# every defaulted key written explicitly.
config_version = 1

[network]
network_id = "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE"
display_name = "example"
role = "coordinator"
coordinator_server_id = "AgICAgICAgICAgICAgICAg"
dns_name = "chat.example"
dns_port = 6697

[server]
server_id = "AgICAgICAgICAgICAgICAg"
name = "chat.example"
data_dir = "/srv/agenc"
runtime_dir = "/run/agenc"
memory_budget_bytes = 4294967296
tokio_worker_threads = 4
crypto_worker_threads = 4
quiesce_seconds = 5
drain_seconds = 20
flush_seconds = 10
stop_seconds = 5
require_locked_secrets = false

[listeners]

[[listeners.endpoint]]
name = "public"
enabled = true
purpose = "client_tls"
bind = "203.0.113.1:6697"
max_connections = 50000
tls_certificate_file = "/etc/agenc/tls/server.crt"
tls_private_key_file = "/etc/agenc/tls/server.key"

[[listeners.endpoint]]
name = "admin"
enabled = true
purpose = "admin_local"
bind = "/run/agenc/admin.sock"
max_connections = 4
allowed_uids = [1000]
allowed_gids = []

[tls]
group_policy = "hybrid_preferred"
session_tickets = true
ticket_rotation_seconds = 21600
ticket_lifetime_seconds = 86400
require_ocsp_staple = false

[federation]
enabled = false
connect_timeout_seconds = 10
reconnect_max_seconds = 60
max_peers = 64

[storage]
state_dir = "/srv/agenc/state"
master_key_file = "/etc/agenc/keys/storage-master.key"
rollback_guard_key_file = "/etc/agenc/keys/rollback-guard.key"
login_index_key_file = "/etc/agenc/keys/login-index-g1.key"
backup_dir = "/srv/agenc-backups"
backup_signing_private_key_file = "/etc/agenc/keys/backup-signing.key"
backup_trust_manifest_file = "/etc/agenc/trust/backup-trust.toml"
database_max_bytes = 85899345920
backup_max_bytes = 107374182400
disk_reserve_bytes = 1073741824
disk_reserve_percent = 5
integrity_checkpoint_manifests = 100000

[accounts]
accept_clients = true
registration = "invite"
invite_verification_key_file = "/etc/agenc/keys/invite-verification.pub"
account_service_hpke_public_key = "BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU"
account_service_hpke_private_key_file = "/etc/agenc/keys/account-service-hpke.key"
opaque_server_setup_file = "/etc/agenc/keys/opaque-server-setup.key"
opaque_fake_credential_key_file = "/etc/agenc/keys/opaque-fake-credential.key"
allow_guests = true
default_public_presence = false
default_allow_guest_dm = false
default_direct_messages = "allow"
max_contacts = 1000
max_reserved_nicknames = 5
auth_transaction_seconds = 30
create_transaction_seconds = 60
credential_change_transaction_seconds = 60

[limits]
client_connections = 50000
tls_handshakes = 1024
direct_connections_per_address = 16
sessions_per_account = 8
channels_per_session = 64
members_per_channel = 4096
global_channels = 100000
local_channels = 10000
invites_per_channel = 256
invites_per_principal = 32
invites_global = 100000
requests_per_connection = 32
response_batches_per_connection = 4
response_batch_bytes = 65536
client_output_bytes = 1048576
client_control_output_bytes = 65536
federation_output_bytes = 16777216
base_outbox_bytes_per_edge = 268435456
base_outbox_objects_per_edge = 65536
parsed_arena_bytes = 32768
channel_key_jobs = 4
opaque_jobs = 8
query_snapshot_rows = 10000
query_snapshots_per_session = 4
query_snapshot_rows_global = 100000
query_snapshot_bytes_global = 67108864

[limits.rate.new_direct]
refill_tokens = 1
refill_seconds = 1
burst = 8

[limits.rate.new_onion]
refill_tokens = 8
refill_seconds = 1
burst = 32

[limits.rate.tls_handshake]
refill_tokens = 4
refill_seconds = 1
burst = 16

[limits.rate.preauth_command]
refill_tokens = 1
refill_seconds = 1
burst = 10

[limits.rate.registered_command]
refill_tokens = 4
refill_seconds = 1
burst = 20

[limits.rate.guest_message]
refill_tokens = 1
refill_seconds = 2
burst = 4

[limits.rate.account_message]
refill_tokens = 2
refill_seconds = 1
burst = 10

[limits.rate.channel_message]
refill_tokens = 10
refill_seconds = 1
burst = 40

[limits.rate.expensive_query]
refill_tokens = 1
refill_seconds = 5
burst = 2

[limits.rate.channel_key_attempt]
refill_tokens = 1
refill_seconds = 30
burst = 4

[limits.rate.account_creation]
refill_tokens = 1
refill_seconds = 3600
burst = 2

[limits.rate.opaque_attempt]
refill_tokens = 1
refill_seconds = 180
burst = 5

[privacy]
log_retention_hours = 24
history_enabled = false
history_default = "24h"
secret_lookup_floor_milliseconds = 5
whowas_retention_seconds = 900
whowas_records = 10000

[moderation]
audit_signing_private_key_file = "/etc/agenc/keys/audit-signing.key"
audit_trust_manifest_file = "/etc/agenc/trust/audit-trust.toml"
audit_retention_days = 30
session_sanction_hours = 24
account_sanction_days = 30
free_reason_bytes = 512

[[moderation.operator]]
operator_id = "BAQEBAQEBAQEBAQEBAQEBA"
display_label = "ops"
signing_public_key = "BgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgY"
local_uids = [1000]
local_gids = []
permissions = ["observe", "configure", "sessions"]
enabled = true

[e2ee]
enabled = false
profile_version = 1
coordinator_server_id = "AgICAgICAgICAgICAgICAg"
max_group_leaves = 512
max_devices_per_account = 64
mailbox_bytes_per_account = 67108864
directory_bytes_per_account = 8388608
stored_bytes_per_conversation = 268435456
global_disk_bytes = 107374182400
federation_peer_bytes_per_second = 16777216
federation_peer_burst_bytes = 33554432
