[package]
name = "agenc-ircd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agenc-ircd"
path = "src/main.rs"

[[bin]]
name = "arcd"
path = "src/bin/arcd.rs"

[features]
default = []
wss = ["agenc-ircd-config/wss", "agenc-ircd-runtime/wss"]
history = ["agenc-ircd-config/history", "agenc-ircd-runtime/history"]

[dependencies]
agenc-ircd-config.workspace = true
agenc-ircd-runtime.workspace = true
agenc-ircd-storage.workspace = true

[dev-dependencies]
agenc-ircd-admin.workspace = true
agenc-ircd-auth.workspace = true
agenc-ircd-crypto.workspace = true
agenc-ircd-testkit.workspace = true
agenc-ircd-types.workspace = true
argon2.workspace = true
base64.workspace = true
mls-rs.workspace = true
mls-rs-crypto-rustcrypto.workspace = true
opaque-ke.workspace = true
opaque-sha2.workspace = true
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto.workspace = true
rustix.workspace = true
rustls.workspace = true
tokio.workspace = true

[lints]
workspace = true
