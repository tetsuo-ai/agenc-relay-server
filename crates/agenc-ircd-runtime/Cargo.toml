history = ["agenc-ircd-domain/history", "agenc-ircd-federation-wire/history", "agenc-ircd-config/history", "agenc-ircd-client-wire/history"]
wss = ["agenc-ircd-client-wire/wss", "agenc-ircd-config/wss", "agenc-ircd-crypto/wss"]

[dependencies]
agenc-ircd-admin.workspace = true
agenc-ircd-auth.workspace = true
agenc-ircd-client-wire.workspace = true
agenc-ircd-config.workspace = true
agenc-ircd-crypto.workspace = true
agenc-ircd-domain.workspace = true
agenc-ircd-e2ee.workspace = true
agenc-ircd-federation-wire.workspace = true
agenc-ircd-storage.workspace = true
agenc-ircd-types.workspace = true
rustls.workspace = true
rustix.workspace = true
subtle.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
agenc-ircd-testkit.workspace = true
loom.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
