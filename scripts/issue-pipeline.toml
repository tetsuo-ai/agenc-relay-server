# Copied to private controller state by `issue-pipeline.py install`.
# Workers cannot change the installed policy by editing this repository copy.
version = 1
repository = "tetsuo-ai/agenc-ircd"
master_issue = 35
base_branch = "main"
state_dir = "~/.local/state/agenc-ircd-pipeline"
model = "claude-fable-5-1"
effort = "high"
claude_path = "claude"
sandbox_runtime_path = "~/.local/share/agenc-ircd-pipeline/tools/node_modules/.bin/srt"
max_issues = 2
max_sessions = 4
max_attempts = 3
max_phases = 4
poll_seconds = 300
agent_timeout_seconds = 7200
gate_timeout_seconds = 10800
minimum_free_gib = 256
use_systemd = true
auto_merge = true
gate_cpu_percent = 1600
gate_memory_gib = 256
