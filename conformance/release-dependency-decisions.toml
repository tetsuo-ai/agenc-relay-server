# Reviewed decisions for every NOASSERTION the release SBOM may still carry.
# scripts/build-release.py verify refuses a build whose SBOM has an undecided
# entry. Native entries name the exact Ubuntu package version, architecture,
# and copyright file digest observed in the release image; the container
# build applies the SPDX expression only on an exact match, so a package
# update in a rebuilt image returns to NOASSERTION until it is reviewed here.
schema_version = 1

