schema_version = 1
evidence_id = "EVID-S04-014-CONSTANT-TIME"
reviewed_revision = "7aec57d4a55762db727409c7201d6113e5a7b4f6"
worktree_state = "dirty-source-hash-bound"
conclusion = "Known and unknown account inputs converge on one OPAQUE server-start implementation with equal-size credential IDs and records. Secret digest and OPAQUE MAC comparisons use constant-time library operations."
limit = "This review does not claim resistance to global timing analysis. Stage 05 must add the fixed storage lookup schedule before the full account lookup path can close AUTH-01."

[measurement]
test = "crates/agenc-ircd-auth/tests/stage_four_security.rs::shuffled_known_and_unknown_opaque_starts_share_one_timing_class"
sample_order = "48 fixed shuffled samples, 24 known and 24 unknown, after four interleaved warmups"
statistic = "separate medians with a pooled median absolute deviation; allowed difference is max(pooled median, 12 * pooled MAD)"
role = "Supplemental regression signal only. The source-bound path review is the primary evidence."

[[surface]]
path = "crates/agenc-ircd-auth/src/service.rs"
sha256 = "29ffa8d13552a4e6eedcda1e8447cb0f9e0e22a1e1c51c0ac824c1bf06e9772f"
symbols = ["begin_authentication"]
review = "Both lookup arms derive the same fixed-key fake credential HMAC, select a 32-byte credential ID and an exact 192-byte record choice, then call OpaqueProfile::authentication_start once. The real digest comparison is constant-time. Stage 05 owns the required fixed storage-lookup schedule."

[[surface]]
path = "crates/agenc-ircd-auth/src/opaque.rs"
sha256 = "626dfe9ab8062b6aa1eda6a985ac1ca9f0505a16b77249bff959feb4d5bd3d79"
symbols = ["OpaqueProfile::authentication_start", "finish_authentication"]
review = "Real and fake selections deserialize one exact-size record and execute the same ServerLogin::start call. Finish consumes one exact-size state and one KE3 on every result."

[[surface]]
path = "crates/agenc-ircd-crypto/src/hash.rs"
sha256 = "49027d6ef18c4fa38f1925084aaf7813c6e31128f79ebe9f298d8520c075fdac"
symbols = ["LoginIndexDigest::matches", "LoginIndexKey::key_id", "derive_fake_credential_id"]
review = "Login digest equality uses subtle::ConstantTimeEq. The public login-index key identifier is a network-bound SHA-256 derivation over the secret key. The fake credential ID is a full HMAC-SHA256 result under an independent key and fixed domain label."

[[surface]]
path = "crates/agenc-ircd-crypto/src/storage.rs"
sha256 = "16af58813802cde4bfe67fdf4623f6b98f1239fa537e5b7a588e73e16b8e5439"
symbols = ["StorageIndex::matches", "StorageMasterKey::matches", "StorageMasterKey::source_operation_key_id", "StorageMasterKey::target_operation_key_id"]
review = "Private storage-index and storage-master-key equality use subtle::ConstantTimeEq over all 32 bytes. Source- and target-role resumability IDs use separate domain labels and expose only a digest."

[[surface]]
path = "vendor/opaque-ke-4.0.1/src/opaque.rs"
sha256 = "e64b3148c6de6b6f2bef26f5b309441963382fc50485da862137ea91e498b36e"
symbols = ["ServerLogin::builder_with_key_material", "ServerLogin::finish"]
review = "The library constructs a dummy record before constant-time real-or-dummy selection and returns only the closed invalid-login error on failed finish. The local patch changes secret lifetime, not transcript work."

[[surface]]
path = "vendor/opaque-ke-4.0.1/src/key_exchange/tripledh.rs"
sha256 = "d767a3f7bc734562582a23dbca8be90cd607819fb1cdc2d69d7a599bbacdaa8f"
symbols = ["TripleDh::finish_ke"]
review = "TripleDH compares the expected and supplied KE3 MAC with ConstantTimeEq before selecting the session key. Context and identifiers are committed when KE2 state is created."

[gate]
status = "evidence-only"
reason = "The repository has uncommitted Stage 04 changes, so this artifact does not claim gate closure."
