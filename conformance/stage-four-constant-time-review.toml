schema_version = 1
evidence_id = "EVID-S04-014-CONSTANT-TIME"
reviewed_revision = "5bc7baba944fcb4166281eedca3d92e875a88946"
worktree_state = "dirty-source-hash-bound"
conclusion = "Known and unknown account inputs converge on one OPAQUE server-start implementation with equal-size credential IDs and records. Secret digest and OPAQUE MAC comparisons use constant-time library operations."
limit = "This review does not claim resistance to global timing analysis. The full account lookup path requires separate Stage 05 evidence for the fixed storage lookup schedule before AUTH-01 can close."

[measurement]
test = "crates/agenc-relay-auth/tests/stage_four_security.rs::shuffled_known_and_unknown_opaque_starts_share_one_timing_class"
sample_order = "48 fixed shuffled samples, 24 known and 24 unknown, after four interleaved warmups"
statistic = "separate medians with a pooled median absolute deviation; allowed difference is max(pooled median, 12 * pooled MAD)"
role = "Supplemental regression signal only. The source-bound path review is the primary evidence."

[[surface]]
path = "crates/agenc-relay-auth/src/service.rs"
sha256 = "8e8f1dbb4d56fac8982f1b5255aab971b5062911b8197def35d63c34d0a16061"
symbols = ["begin_authentication"]
review = "Both lookup arms derive the same fixed-key fake credential HMAC, select a 32-byte credential ID and an exact 192-byte record choice, then call OpaqueProfile::authentication_start once. The real digest comparison is constant-time. Stage 05 owns the required fixed storage-lookup schedule. The 2026-09-15 re-review for the ZDH-A1 invitation-interval repair (issue #38) confirmed that begin_authentication and begin_authentication_with_entropy are byte-for-byte unchanged; the only source changes carry the invitation not_before through ValidatedInvitation and the 361-byte creation transaction record and recheck the exact invitation interval in finish_account_creation_with_entropy against public invitation bounds and the trusted FINISH-time UTC read. No secret comparison, fake-credential selection, OPAQUE start or finish work changed."

[[surface]]
path = "crates/agenc-relay-auth/src/opaque.rs"
sha256 = "4dc6a655635e9f8e45acefdd552c13354a5be5f58f9e12afeb25a9ace23ff65f"
symbols = ["OpaqueProfile::authentication_start", "finish_authentication", "opaque_server_public_key"]
review = "Real and fake selections deserialize one exact-size record and execute the same ServerLogin::start call. Finish consumes one exact-size state and one KE3 on every result. The 2026-09-04 re-review confirmed that the only source change replaces a setup-byte slice in opaque_server_public_key with ServerSetup::keypair().public().serialize(), returning the AKE public key used by the library's registration response. The pinned keypair accessors return references, and serialization compresses that public Ristretto point. The helper's only production caller checks daemon key identities. Login worker callers, start and finish work, and secret comparisons are unchanged. The other five reviewed source hashes remain unchanged. The registration-response identity regression covers the corrected output. The 2026-10-01 re-review for the OPAQUE profile extraction (X-08, SDK program) confirmed that the only source changes move the suite, the fixed Argon2id KSF, the context label and the latched random-number adapter into profile.rs, construct every adapter over OsEntropy, build the context as a fixed 68-byte array instead of a fallibly allocated vector, and take both identities from opaque_identifiers. Real and fake selections still deserialize one exact-size record and execute the same ServerLogin::start call with the same context, identities and parameters; finish, dummy-finish work, opaque_server_public_key and secret comparisons are unchanged."

[[surface]]
path = "crates/agenc-relay-auth/src/profile.rs"
sha256 = "9bff77bd1dae22a7339d4b2abe4fa941ced0cd1a6dbb659f469a751b0c5c3016"
symbols = ["AgencOpaqueSuite", "FallibleOpaqueRng::fill_or_latch", "opaque_context", "opaque_identifiers"]
review = "Added by the 2026-10-01 OPAQUE profile extraction (X-08, SDK program): the suite, the fixed Argon2id KSF, the context label and the latched random-number adapter moved here from opaque.rs with unchanged logic. The adapter now draws from a generic EntropySource, and every server caller instantiates it with OsEntropy, whose fill_exact is OsEntropy::fill. The context is the label followed by the Network ID in a fixed 68-byte array, and the identities are the credential ID and the Network ID, as before. The module holds no secret comparison and no real-or-fake selection; the known and unknown account paths call the same adapter, context and identity constructors. The binding keeps these definitions under the review they had inside opaque.rs."

[[surface]]
path = "crates/agenc-relay-crypto/src/hash.rs"
sha256 = "865f5d82a64cc0fb648ee6e511f61ae7d1cf53ead8b9a179b065a3e17eec0707"
symbols = ["LoginIndexDigest::matches", "LoginIndexKey::key_id", "derive_fake_credential_id"]
review = "Login digest equality uses subtle::ConstantTimeEq. The public login-index key identifier is a network-bound SHA-256 derivation over the secret key. The fake credential ID is a full HMAC-SHA256 result under an independent key and fixed domain label. The 2026-09-10 re-review against 68defd5 found only the new unkeyed Sha256Stream adapter and the FederationSnapshotHash module export. Their production callers hash release artifacts and public federation snapshots; neither enters login selection, HMAC derivation or secret comparison. The new snapshot adapter bounds its declared input and requires complete consumption. The reviewed login functions are byte-for-byte unchanged. The 2026-09-15 re-review for the leaf-membership work (ENC-05) found only the added SemanticHashDomain::LeafMembershipId variant and its `ARC-MLS/1 leaf membership id` label: a public semantic-hash domain used for companion object identifiers that enters neither login selection, HMAC derivation nor any secret comparison. The reviewed login functions remain byte-for-byte unchanged. The 2026-09-15 re-review for the recovery submission carrier (ENC-03) found only the added SemanticHashDomain::RecoverySubmissionId variant and its `ARC-MLS/1 recovery submission id` label: a public semantic-hash domain for companion object identifiers that enters neither login selection, HMAC derivation nor any secret comparison. The reviewed login functions remain byte-for-byte unchanged."

[[surface]]
path = "crates/agenc-relay-crypto/src/storage.rs"
sha256 = "7a3ff3eb60360f468eb379a9b389f27b0daa51597d26e69d202f2d765db00b45"
symbols = ["StorageIndex::matches", "StorageMasterKey::matches", "StorageMasterKey::source_operation_key_id", "StorageMasterKey::target_operation_key_id"]
review = "Private storage-index and storage-master-key equality use subtle::ConstantTimeEq over all 32 bytes. Source- and target-role resumability IDs use separate domain labels and expose only a digest. The 2026-09-10 re-review against 68defd5 found only DatabaseBinding::database_instance_id, a const accessor returning the existing public database identity. It adds no secret-dependent work or comparison. All four reviewed functions are byte-for-byte unchanged. The 2026-09-13 re-review against 5721b3d confirmed the same four functions remain unchanged. SealedStorageRecord now stores owned or borrowed ciphertext; the new constructor checks only public ciphertext length, and ownership selection determines whether materialization copies. Opening retains the same associated-data construction and XChaCha20Poly1305 decrypt call. No secret comparison, authentication selection, key derivation, or plaintext lifetime changed."

[[surface]]
path = "vendor/opaque-ke-4.0.1/src/opaque.rs"
sha256 = "e64b3148c6de6b6f2bef26f5b309441963382fc50485da862137ea91e498b36e"
symbols = ["ServerLogin::builder_with_key_material", "ServerLogin::finish"]
review = "The library constructs a dummy record before constant-time real-or-dummy selection and returns only the closed invalid-login error on failed finish. The local patch changes secret lifetime, not transcript work."

[[surface]]
path = "vendor/opaque-ke-4.0.1/src/key_exchange/tripledh.rs"
sha256 = "d767a3f7bc734562582a23dbca8be90cd607819fb1cdc2d69d7a599bbacdaa8f"
symbols = ["TripleDh::finish_ke"]
review = "TripleDH compares the expected and supplied KE3 MAC with ConstantTimeEq before selecting the session key. Context and identifiers are committed when KE2 state is created."

# ARC rebaseline on 2026-09-21: comparison with the pre-rename source
# confirms only imports, public ARC labels, ARCD database magic and formatting
# changed in the four project-owned surfaces. Secret comparisons and the
