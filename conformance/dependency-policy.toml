[[reviewed_duplicate_crypto_generation]]
id = "DEP-EXCEPTION-OPAQUE-0001"
root_package = "opaque-ke"
root_version = "=4.0.1"
status = "approved-when-reachable"
allowed_duplicate_packages = ["curve25519-dalek", "digest", "hmac", "sha2"]
