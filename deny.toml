[graph]
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
deny = [
    { crate = "native-tls", reason = "the transport profile is rustls-only" },
    { crate = "openssl", reason = "the transport profile is rustls-only" },
    { crate = "openssl-sys", reason = "the transport profile is rustls-only" },
]
skip = []
skip-tree = []

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
include-dev = true
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
registries = []
