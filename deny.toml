[graph]
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
deny = [
    { crate = "native-tls", reason = "the transport profile is rustls-only" },
    { crate = "openssl", reason = "the transport profile is rustls-only" },
    { crate = "openssl-sys", reason = "the transport profile is rustls-only" },
]
skip = [
    { crate = "block-buffer@0.10.4", reason = "opaque-ke 4.0.1 retains the reviewed RustCrypto 0.10 generation" },
    { crate = "cpufeatures@0.2.17", reason = "opaque-ke 4.0.1 retains the reviewed RustCrypto 0.10 generation" },
    { crate = "crypto-common@0.1.7", reason = "opaque-ke 4.0.1 retains the reviewed RustCrypto 0.10 generation" },
    { crate = "curve25519-dalek@4.1.3", reason = "opaque-ke 4.0.1 pins the RFC-9807-compatible curve generation" },
    { crate = "digest@0.10.7", reason = "opaque-ke 4.0.1 retains the reviewed RustCrypto 0.10 generation" },
    { crate = "hkdf@0.12.4", reason = "opaque-ke 4.0.1 retains its audited internal HKDF generation" },
    { crate = "hmac@0.12.1", reason = "opaque-ke 4.0.1 retains its audited internal HMAC generation" },
    { crate = "rand_core@0.6.4", reason = "opaque-ke 4.0.1 retains its audited internal RNG trait generation" },
    { crate = "sha2@0.10.9", reason = "opaque-ke 4.0.1 uses the reviewed SHA-512 generation through a scoped alias" },
    { crate = "syn@2.0.119", reason = "the reviewed crypto derive graph and current proc macros span syn 2 and 3" },
    { crate = "const-oid@0.10.2", reason = "the test-only MLS clients (openmls, mls-rs) for the Stage 08 interoperability gate use the current RustCrypto generation" },
    { crate = "getrandom@0.4.3", reason = "the test-only MLS clients (openmls, mls-rs) for the Stage 08 interoperability gate use the current getrandom generation" },
]
skip-tree = []

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
include-dev = true
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
]

[licenses.private]
ignore = true
registries = []
